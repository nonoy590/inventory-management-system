{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Edit Item</h1>
      <p>Update details for this product.</p>
    </div>
  </div>

  <div class="card form-card">
    <form method="POST" class="item-form">
      <label for="name">Item Name</label>
      <input type="text" id="name" name="name" value="{{ item.name }}" required>

      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="" {{ 'selected' if not item.category }}>— None —</option>
        {% for cat in categories %}
          <option value="{{ cat.name }}" {{ 'selected' if item.category == cat.name }}>{{ cat.name }}</option>
        {% endfor %}
      </select>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="0" value="{{ item.quantity }}">

      <label for="unit">Unit</label>
      <select id="unit" name="unit">
        {% for u in units %}
          <option value="{{ u }}" {{ 'selected' if item.unit == u }}>{{ u }}</option>
        {% endfor %}
      </select>

      <label for="price">Price per unit</label>
      <input type="number" id="price" name="price" min="0" step="0.01" value="{{ item.price }}">

      <label for="low_stock_threshold">Low Stock Threshold</label>
      <input type="number" id="low_stock_threshold" name="low_stock_threshold" min="0" value="{{ item.low_stock_threshold }}">

      <div class="form-actions">
        <button type="submit" class="button">Update Item</button>
        <a href="{{ url_for('products') }}" class="button button-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
