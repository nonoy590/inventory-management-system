{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Edit Supplier</h1>
      <p>Update this supplier's details.</p>
    </div>
  </div>

  <div class="card form-card">
    <form method="POST" class="item-form">
      <label for="name">Supplier Name</label>
      <input type="text" id="name" name="name" value="{{ supplier.name }}" required>

      <label for="contact_person">Contact Person</label>
      <input type="text" id="contact_person" name="contact_person" value="{{ supplier.contact_person or '' }}">

      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ supplier.phone or '' }}">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ supplier.email or '' }}">

      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ supplier.address or '' }}">

      <div class="form-actions">
        <button type="submit" class="button">Update Supplier</button>
        <a href="{{ url_for('suppliers') }}" class="button button-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
