{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Add Supplier</h1>
      <p>Add a new supplier to your contacts.</p>
    </div>
  </div>

  <div class="card form-card">
    <form method="POST" class="item-form">
      <label for="name">Supplier Name</label>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required>

      <label for="contact_person">Contact Person</label>
      <input type="text" id="contact_person" name="contact_person" value="{{ form.get('contact_person', '') }}">

      <label for="phone">Phone</label>
      <input type="text" id="phone" name="phone" value="{{ form.get('phone', '') }}">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ form.get('email', '') }}">

      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ form.get('address', '') }}">

      <div class="form-actions">
        <button type="submit" class="button">Save Supplier</button>
        <a href="{{ url_for('suppliers') }}" class="button button-secondary">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
